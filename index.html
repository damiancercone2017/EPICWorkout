<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EPIC Workout">
<meta name="theme-color" content="#6f5a86">
<title>EPIC Workout 1.5 — Google Sheets Sync</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#6f5a86;--panel:#816b99;--panel2:#927eaa;--line:#a693b8;--text:#fffdfd;--muted:#e5ddea;--accent:#ead9a2;--accent2:#d7c7e5;--green:#b9dfc1;--red:#f0bbc3}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:480px;min-height:100vh;margin:auto;padding-bottom:78px}
header{position:sticky;top:0;z-index:20;background:rgba(111,90,134,.97);backdrop-filter:blur(12px);padding:15px 16px 12px;border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;letter-spacing:1.7px;color:var(--accent);font-weight:700}.date{font-size:12px;color:var(--muted)}
.daynav{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-top:10px}.daynav button{height:38px;border:0;background:transparent;color:var(--muted);font-size:25px}.daytitle{text-align:center}.daytitle h1{margin:0;font-size:22px;font-weight:650}.daytitle p{margin:3px 0 0;color:var(--muted);font-size:12px}
main{padding:14px 14px 24px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.metric{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.metric span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.metric strong{display:block;margin-top:4px;font-size:18px;color:var(--accent);font-weight:650}
.section-label{margin:16px 1px 8px;font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1px}.subtle-note{font-size:11px;color:var(--muted);line-height:1.45;margin:6px 1px 12px}
.library-item{border-bottom:1px solid var(--line)}.library-button{width:100%;border:0;background:transparent;color:var(--text);padding:13px 2px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}.library-main{min-width:0}.library-name{font-size:16px;font-weight:650}.library-note{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.library-last{text-align:right;flex:none;font-size:10px;color:var(--accent2);line-height:1.4}.chev{font-size:18px;color:var(--muted);margin-left:6px}
.editor{padding:0 2px 15px}.aim{margin:0 0 10px;padding:9px 11px;border-left:3px solid var(--accent);background:rgba(255,255,255,.06);border-radius:0 9px 9px 0}.aim span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px}.aim strong{display:block;margin-top:3px;font-size:13px;font-weight:600}
.set-header,.set-row{display:grid;grid-template-columns:38px 1fr 1fr 52px;gap:7px;align-items:center}.set-header{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px}.set-row{margin-top:5px}.set-num{font-size:12px;color:var(--muted)}.number{width:100%;min-width:0;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:0 8px;font-size:21px;text-align:center;outline:none}.number:focus{border-color:var(--accent2);background:var(--panel2)}.set-volume{text-align:right;color:var(--muted);font-size:11px}
.editor-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.volume{font-size:12px;color:var(--muted)}.volume strong{color:var(--accent);font-size:16px;margin-left:4px}.done{border:1px solid var(--accent2);border-radius:10px;background:transparent;color:var(--text);padding:9px 14px;font-size:12px;font-weight:650}
.logged{color:var(--green)}.cardio-editor{display:grid;grid-template-columns:1fr 105px;gap:8px;padding:0 2px 15px}.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:13px}
.setup-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}.setup-top{display:flex;gap:8px;align-items:flex-start}.grow{flex:1;min-width:0}.text-input,.notes-input{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);padding:10px;outline:none}.notes-input{margin-top:5px;resize:vertical;min-height:58px;color:var(--muted);font-size:12px}.delete{width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--red);font-size:17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.primary,.secondary{border-radius:11px;padding:11px;border:1px solid var(--line);font-weight:650}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.secondary{background:transparent;color:var(--text)}
.savebar{position:sticky;bottom:70px;padding:10px 14px;background:linear-gradient(180deg,rgba(111,90,134,0),rgba(111,90,134,.98) 28%);z-index:15}.save-workout{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--bg);font-weight:750;font-size:15px}.save-status{text-align:center;font-size:11px;color:var(--green);min-height:16px;margin-top:5px}.history-date{margin:14px 0 7px;color:var(--accent);font-size:12px;font-weight:700}.history-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}.history-card strong{display:block;font-size:14px}.history-card small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.history-empty{padding:28px 10px;text-align:center;color:var(--muted)}.cloud-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin:8px 0 14px}.cloud-card h3{margin:0 0 6px;font-size:15px}.cloud-state{font-size:12px;color:var(--muted);line-height:1.45;margin:5px 0 10px}.cloud-state.ok{color:var(--green)}.cloud-state.warn{color:var(--accent)}.cloud-state.error{color:var(--red)}.full{width:100%}.setup-help{font-size:11px;line-height:1.45;color:var(--muted);margin-top:7px}.sync-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.history-toolbar{display:flex;gap:8px;margin:4px 0 12px}.history-toolbar button{flex:1}.sync-badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--muted);margin-left:6px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(111,90,134,.98);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}.nav{flex:1;border:0;background:transparent;color:var(--muted);padding:4px;font-size:11px}.nav span{display:block;font-size:18px;margin-bottom:2px}.nav.active{color:var(--accent)}.hidden{display:none!important}
@media(max-width:350px){.set-header,.set-row{grid-template-columns:32px 1fr 1fr 46px;gap:5px}.number{padding:0 4px}}
</style>
</head>
<body>
<div class="app">
<header><div class="topline"><div class="brand">EPIC WORKOUT</div><div class="date" id="todayDate"></div></div><div class="daynav"><button id="prevDay" aria-label="Previous day">‹</button><div class="daytitle"><h1 id="dayName"></h1><p id="daySubtitle">Choose what fits today.</p></div><button id="nextDay" aria-label="Next day">›</button></div></header>
<section id="todayView"><main id="todayContent"></main><div class="savebar"><button class="save-workout" id="saveWorkout">Save Workout</button><div class="save-status" id="saveStatus"></div></div></section>
<section id="historyView" class="hidden"><main id="historyContent"></main></section>
<section id="setupView" class="hidden"><main id="setupContent"></main></section>
<nav class="bottom"><button class="nav active" data-view="today"><span>◆</span>Workout</button><button class="nav" data-view="history"><span>◷</span>History</button><button class="nav" data-view="setup"><span>⚙</span>Setup</button></nav>
</div>
<script>
const STORAGE='epic_workout_v15';
const LEGACY_STORAGE='epic_workout_v10';
const STANDARD_STRENGTH=[
{id:'incline-db',name:'Incline DB Press',notes:'45-degree incline dumbbell bench press'},
{id:'incline-machine',name:'Incline Chest Press',notes:'Incline chest press machine'},
{id:'lateral-raise',name:'Lateral Raise',notes:'Two-arm lateral shoulder raise using curl bar'},
{id:'seated-db-curl',name:'Seated DB Curl',notes:'Seated dumbbell curls'},
{id:'trap-deadlift',name:'Trap Bar Deadlift',notes:'Trap bar deadlift'},
{id:'leg-press',name:'Leg Press',notes:'Leg press machine'},
{id:'face-pull',name:'Face Pull',notes:'Seated face pull with rope grip'},
{id:'tricep-pulldown',name:'Tricep Pulldown',notes:'Straight-bar tricep cable pulldown'},
{id:'calf-raise',name:'Calf Raise',notes:'Calf machine'},
{id:'left-curl',name:'Left DB Curl',notes:'Single-arm dumbbell curl — left side'},
{id:'left-row',name:'Left Cable Row',notes:'Single-arm cable row — left side'},
{id:'left-press',name:'Left Overhead Press',notes:'Single-arm overhead press — left side'},
{id:'left-tricep',name:'Left Tricep Extension',notes:'Single-arm tricep extension — left side'}];
const STANDARD_CARDIO=[
{id:'run-5k',name:'Outdoor Run / 5K',notes:'Running club, road run, or hard cardio session'},
{id:'incline-walk',name:'Incline Treadmill',notes:'Adjust speed and incline as needed'},
{id:'bike',name:'Bike',notes:'Indoor or outdoor cycling'},
{id:'elliptical',name:'Elliptical',notes:'Easy or moderate cardio'},
{id:'light-cardio',name:'Other Cardio',notes:'Rower, walk, or another cardio activity'}];
const GOOGLE_APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxYZ2pe8LAS8PrIJhDp7fOxnh7ZHSgF9VV3GYGCzNhcMjP3ra_YxFtliy4F_JyJfl-W0A/exec';
const CLOUD_KEY_STORAGE='epicWorkoutCloudAccessKey';
let data=loadData();
data.cloud.endpoint=GOOGLE_APPS_SCRIPT_URL;
try{const savedCloudKey=localStorage.getItem(CLOUD_KEY_STORAGE);if(savedCloudKey)data.cloud.accessKey=savedCloudKey}catch(e){}
let selectedDate=new Date();selectedDate.setHours(12,0,0,0);
let activeView='today';
const expanded=new Set();
function clone(v){return JSON.parse(JSON.stringify(v))}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isoDate(d){const x=new Date(d);x.setHours(12,0,0,0);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function volume(sets){return (sets||[]).reduce((sum,s)=>sum+num(s.weight)*num(s.reps),0)}
function fmt(n){return Math.round(n).toLocaleString()}
function save(){localStorage.setItem(STORAGE,JSON.stringify(data))}
function cloudConfigured(){return !!(GOOGLE_APPS_SCRIPT_URL&&data.cloud?.accessKey)}
function cloudLabel(){return cloudConfigured()?'Google Sheets connected':'Google Sheets not connected'}
function setSaveStatus(message,kind=''){const el=document.getElementById('saveStatus');el.textContent=message;el.style.color=kind==='error'?'var(--red)':kind==='warn'?'var(--accent)':'var(--green)'}
function workoutPayload(dateKey,s){return {action:'saveWorkout',accessKey:data.cloud.accessKey,workoutId:s.workoutId||('epic-'+dateKey),date:dateKey,savedAt:s.savedAt||new Date().toISOString(),updatedAt:new Date().toISOString(),device:navigator.userAgent.slice(0,180),session:s}}
async function cloudRequest(payload){const r=await fetch(GOOGLE_APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);const text=await r.text();let result;try{result=JSON.parse(text)}catch(e){throw new Error('Unexpected response from Google Apps Script')}if(!result.ok)throw new Error(result.error||'Google Sheets request failed');return result}
async function syncWorkout(dateKey){if(!cloudConfigured())throw new Error('Open Setup and connect Google Sheets first.');const s=data.sessions[dateKey];if(!s)throw new Error('Workout not found.');s.syncStatus='syncing';save();const result=await cloudRequest(workoutPayload(dateKey,s));s.syncStatus='synced';s.cloudSavedAt=result.savedAt||new Date().toISOString();s.workoutId=result.workoutId||s.workoutId||('epic-'+dateKey);save();return result}
async function loadCloudHistory(){if(!cloudConfigured())throw new Error('Open Setup and connect Google Sheets first.');const result=await cloudRequest({action:'listWorkouts',accessKey:data.cloud.accessKey});(result.workouts||[]).forEach(w=>{if(!w.date||!w.session)return;const local=data.sessions[w.date];if(!local||String(w.updatedAt||'')>=String(local.updatedAt||local.savedAt||'')){data.sessions[w.date]=w.session;data.sessions[w.date].syncStatus='synced';data.sessions[w.date].cloudSavedAt=w.savedAt||w.updatedAt||'';data.sessions[w.date].workoutId=w.workoutId||('epic-'+w.date)}});save();return result.workouts?.length||0}
async function testCloud(){if(!cloudConfigured())throw new Error('Enter your private access key first.');await cloudRequest({action:'ping',accessKey:data.cloud.accessKey});await cloudRequest({action:'listWorkouts',accessKey:data.cloud.accessKey});return {ok:true}}
function displayDate(k){const d=new Date(k+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function dedupe(items){const map=new Map();(items||[]).forEach(x=>{if(!x?.id)return;if(!map.has(x.id))map.set(x.id,{id:x.id,name:x.name||'Exercise',notes:x.notes||''})});return [...map.values()]}
function loadData(){let d=null;try{d=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem(LEGACY_STORAGE)||'null')}catch(e){};if(!d)d={sessions:{}};d.sessions=d.sessions||{};d.cloud=d.cloud||{endpoint:GOOGLE_APPS_SCRIPT_URL,accessKey:''};d.cloud.endpoint=GOOGLE_APPS_SCRIPT_URL;
 if(!d.library){const strength=[],cardio=[];Object.values(d.plans||{}).forEach(p=>{strength.push(...(p.strength||[]));cardio.push(...(p.cardio||[]))});d.library={strength:dedupe(strength.length?strength:STANDARD_STRENGTH),cardio:dedupe(cardio.length?cardio:STANDARD_CARDIO)}}
 d.library.strength=dedupe(d.library.strength);d.library.cardio=dedupe(d.library.cardio);localStorage.setItem(STORAGE,JSON.stringify(d));return d}
function key(){return isoDate(selectedDate)}
function session(){const k=key();data.sessions[k]??={day:selectedDate.toLocaleDateString('en-US',{weekday:'long'}),strength:{},cardio:{},workoutId:'epic-'+k,syncStatus:'local'};return data.sessions[k]}
function strengthLog(id){const s=session();s.strength[id]??={nameSnapshot:data.library.strength.find(x=>x.id===id)?.name||'Exercise',sets:[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}],complete:false};return s.strength[id]}
function cardioLog(id){const s=session();s.cardio[id]??={nameSnapshot:data.library.cardio.find(x=>x.id===id)?.name||'Cardio',minutes:'',complete:false};return s.cardio[id]}
function hasStrength(l){return !!l?.sets?.some(x=>num(x.weight)||num(x.reps))}
function hasCardio(l){return num(l?.minutes)>0}
function lastStrength(id){for(const k of Object.keys(data.sessions).filter(x=>x<key()).sort().reverse()){const l=data.sessions[k]?.strength?.[id];if(hasStrength(l))return {key:k,item:l}}return null}
function lastCardio(id){for(const k of Object.keys(data.sessions).filter(x=>x<key()).sort().reverse()){const l=data.sessions[k]?.cardio?.[id];if(hasCardio(l))return {key:k,item:l}}return null}
function lastUsed(id,type){for(const k of Object.keys(data.sessions).sort().reverse()){const l=data.sessions[k]?.[type]?.[id];if(type==='strength'?hasStrength(l):hasCardio(l))return k}return ''}
function sortedLibrary(type){const items=[...(data.library[type]||[])];return items.sort((a,b)=>{const sa=session()[type]?.[a.id],sb=session()[type]?.[b.id];const ta=type==='strength'?hasStrength(sa):hasCardio(sa),tb=type==='strength'?hasStrength(sb):hasCardio(sb);if(ta!==tb)return tb-ta;return lastUsed(b.id,type).localeCompare(lastUsed(a.id,type))||a.name.localeCompare(b.name)})}
function renderHeader(){document.getElementById('todayDate').textContent=selectedDate.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('dayName').textContent=activeView==='today'?selectedDate.toLocaleDateString('en-US',{weekday:'long'}):(activeView==='history'?'Workout History':'Setup');document.getElementById('daySubtitle').textContent=activeView==='today'?'Choose what fits today.':(activeView==='history'?(cloudConfigured()?'Local + Google Sheets history':'Local workout history'):'Exercise library & cloud connection')}
function renderToday(){const s=session();const usedStrength=Object.values(s.strength||{}).filter(hasStrength);const usedCardio=Object.values(s.cardio||{}).filter(hasCardio);const totalVolume=usedStrength.reduce((sum,l)=>sum+volume(l.sets),0);let html=`<div class="summary"><div class="metric"><span>Activities</span><strong>${usedStrength.length+usedCardio.length}</strong></div><div class="metric"><span>Today's volume</span><strong>${fmt(totalVolume)}</strong></div></div><div class="subtle-note">Tap any activity to enter it. Leave everything else blank—it will not be recorded.</div><div class="section-label">Strength</div>`;
 const strength=sortedLibrary('strength');if(!strength.length)html+='<div class="empty">Add strength exercises in Setup.</div>';
 strength.forEach(ex=>{const l=s.strength?.[ex.id],prev=lastStrength(ex.id),open=expanded.has('s:'+ex.id),used=hasStrength(l);const summary=used?(l.sets||[]).filter(x=>num(x.weight)||num(x.reps)).map(x=>`${x.weight||0}×${x.reps||0}`).join(' · '):(prev?`Last: ${prev.item.sets.filter(x=>num(x.weight)||num(x.reps)).map(x=>`${x.weight||0}×${x.reps||0}`).join(' · ')}`:'Not recorded yet');html+=`<article class="library-item" data-id="${esc(ex.id)}"><button class="library-button" data-action="toggle-strength"><div class="library-main"><div class="library-name ${used?'logged':''}">${used?'✓ ':''}${esc(ex.name)}</div><div class="library-note">${esc(summary||ex.notes||'')}</div></div><div class="library-last">${used?fmt(volume(l.sets))+' volume':(prev?fmt(volume(prev.item.sets))+' previous':'')}<span class="chev">${open?'⌃':'⌄'}</span></div></button>`;
 if(open){const log=strengthLog(ex.id);html+=`<div class="editor">${prev?'<div class="aim"><span>Today\'s aim</span><strong>Beat one number.</strong></div>':''}<div class="set-header"><span>Set</span><span>Weight</span><span>Reps</span><span>Volume</span></div>${log.sets.map((x,i)=>`<div class="set-row"><div class="set-num">${i+1}</div><input class="number" type="number" inputmode="decimal" data-set="${i}" data-field="weight" value="${esc(x.weight)}" placeholder="${esc(prev?.item?.sets?.[i]?.weight||'—')}"><input class="number" type="number" inputmode="numeric" data-set="${i}" data-field="reps" value="${esc(x.reps)}" placeholder="${esc(prev?.item?.sets?.[i]?.reps||'—')}"><div class="set-volume">${fmt(num(x.weight)*num(x.reps))}</div></div>`).join('')}<div class="editor-foot"><div class="volume">Volume <strong>${fmt(volume(log.sets))}</strong></div><button class="done" data-action="done-strength">Done</button></div></div>`}html+='</article>'});
 html+='<div class="section-label">Cardio & Running</div>';const cardio=sortedLibrary('cardio');if(!cardio.length)html+='<div class="empty">Add cardio activities in Setup.</div>';
 cardio.forEach(item=>{const l=s.cardio?.[item.id],prev=lastCardio(item.id),open=expanded.has('c:'+item.id),used=hasCardio(l);html+=`<article class="library-item" data-cardio="${esc(item.id)}"><button class="library-button" data-action="toggle-cardio"><div class="library-main"><div class="library-name ${used?'logged':''}">${used?'✓ ':''}${esc(item.name)}</div><div class="library-note">${used?esc(l.minutes+' minutes'):(prev?esc('Last: '+prev.item.minutes+' minutes'):esc(item.notes||'Not recorded yet'))}</div></div><div class="library-last">${used?'Recorded':(prev?'Previous':'')}<span class="chev">${open?'⌃':'⌄'}</span></div></button>${open?`<div class="cardio-editor"><input class="number" type="number" inputmode="numeric" data-field="minutes" value="${esc(cardioLog(item.id).minutes)}" placeholder="Minutes"><button class="done" data-action="done-cardio">Done</button></div>`:''}</article>`});document.getElementById('todayContent').innerHTML=html}

function renderHistory(){
 const entries=Object.entries(data.sessions||{}).filter(([k,s])=>Object.values(s.strength||{}).some(hasStrength)||Object.values(s.cardio||{}).some(hasCardio)).sort((a,b)=>b[0].localeCompare(a[0]));
 if(!entries.length){document.getElementById('historyContent').innerHTML='<div class="history-empty">No saved workouts yet.<br>Enter a workout and tap <strong>Save Workout</strong>.</div>';return}
 let html=`<div class="subtle-note">${cloudConfigured()?'Workouts are retained locally and can be refreshed from Google Sheets.':'History is currently stored only in this browser. Connect Google Sheets in Setup.'}</div><div class="history-toolbar"><button class="secondary" data-action="refresh-cloud">Refresh from Sheets</button><button class="secondary" data-action="sync-pending">Sync pending</button></div>`;
 entries.forEach(([k,s])=>{const badge=s.syncStatus==='synced'?'Cloud saved':(s.savedAt?'Local only':'Draft');html+=`<div class="history-date">${displayDate(k)} <span class="sync-badge">${badge}</span></div>`;Object.values(s.strength||{}).filter(hasStrength).forEach(l=>{const sets=(l.sets||[]).filter(x=>num(x.weight)||num(x.reps)).map(x=>`${x.weight||0} × ${x.reps||0}`).join(' · ');html+=`<div class="history-card"><strong>${esc(l.nameSnapshot||'Exercise')}</strong><small>${esc(sets)}<br>Volume: ${fmt(volume(l.sets))}</small></div>`});Object.values(s.cardio||{}).filter(hasCardio).forEach(l=>{html+=`<div class="history-card"><strong>${esc(l.nameSnapshot||'Cardio')}</strong><small>${esc(l.minutes)} minutes</small></div>`})});
 document.getElementById('historyContent').innerHTML=html;
}
function renderSetup(){let html=`<div class="section-label">Google Sheets connection</div><div class="cloud-card"><h3>${cloudLabel()}</h3><div class="cloud-state ${cloudConfigured()?'ok':'warn'}" id="cloudState">${cloudConfigured()?'Ready to save and retrieve workouts from your private sheet.':'Enter the private access key from Settings!B1.'}</div><div class="setup-help"><strong>Cloud service:</strong> Connected to Damian’s EPIC Workout Google Apps Script deployment.</div><input class="text-input full" style="margin-top:10px" id="cloudKey" type="password" value="${esc(data.cloud.accessKey||'')}" placeholder="Private access key from Settings!B1"><div class="sync-row"><button class="primary" data-action="save-cloud">Save key</button><button class="secondary" data-action="test-cloud">Test connection</button></div><div class="setup-help">The Apps Script URL is built into this version. The key is stored only in this browser, so enter it once on your laptop and once on your iPhone.</div></div><div class="subtle-note">This master library appears every day. Add, rename, or remove activities here.</div><div class="section-label">Strength exercises</div>`;data.library.strength.forEach(ex=>{html+=`<div class="setup-card" data-id="${esc(ex.id)}"><div class="setup-top"><div class="grow"><input class="text-input" data-field="name" value="${esc(ex.name)}"><textarea class="notes-input" data-field="notes" placeholder="Optional equipment or form note">${esc(ex.notes||'')}</textarea></div><button class="delete" data-action="delete-strength">×</button></div></div>`});html+=`<div class="actions"><button class="primary" data-action="add-strength">Add exercise</button><button class="secondary" data-action="restore-strength">Restore standards</button></div><div class="section-label">Cardio & running</div>`;data.library.cardio.forEach(c=>{html+=`<div class="setup-card" data-cardio="${esc(c.id)}"><div class="setup-top"><div class="grow"><input class="text-input" data-field="name" value="${esc(c.name)}"><textarea class="notes-input" data-field="notes" placeholder="Optional cardio note">${esc(c.notes||'')}</textarea></div><button class="delete" data-action="delete-cardio">×</button></div></div>`});html+=`<div class="actions"><button class="primary" data-action="add-cardio">Add cardio</button><button class="secondary" data-action="restore-cardio">Restore standards</button></div>`;document.getElementById('setupContent').innerHTML=html}
function renderAll(){renderHeader();if(activeView==='today')renderToday();if(activeView==='history')renderHistory();if(activeView==='setup')renderSetup()}
document.getElementById('prevDay').addEventListener('click',()=>{selectedDate.setDate(selectedDate.getDate()-1);expanded.clear();renderAll()});document.getElementById('nextDay').addEventListener('click',()=>{selectedDate.setDate(selectedDate.getDate()+1);expanded.clear();renderAll()});
document.querySelector('.bottom').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;activeView=b.dataset.view;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('todayView').classList.toggle('hidden',activeView!=='today');document.getElementById('historyView').classList.toggle('hidden',activeView!=='history');document.getElementById('setupView').classList.toggle('hidden',activeView!=='setup');renderAll();if(activeView==='history'&&cloudConfigured())loadCloudHistory().then(()=>renderHistory()).catch(()=>{})});
document.getElementById('saveWorkout').addEventListener('click',async()=>{const s=session();const hasAny=Object.values(s.strength||{}).some(hasStrength)||Object.values(s.cardio||{}).some(hasCardio);if(!hasAny){setSaveStatus('Enter at least one exercise or cardio activity first.','error');return}s.savedAt=new Date().toISOString();s.updatedAt=s.savedAt;s.syncStatus='local';s.workoutId=s.workoutId||('epic-'+key());save();if(!cloudConfigured()){setSaveStatus('✓ Saved locally — connect Google Sheets in Setup','warn');return}try{setSaveStatus('Syncing to Google Sheets…','warn');await syncWorkout(key());setSaveStatus('✓ Saved to Google Sheets')}catch(err){s.syncStatus='local';save();setSaveStatus('✓ Saved locally — cloud sync failed: '+err.message,'error')}});
document.getElementById('todayContent').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ex=b.closest('[data-id]'),c=b.closest('[data-cardio]');if(b.dataset.action==='toggle-strength'){const k='s:'+ex.dataset.id;expanded.has(k)?expanded.delete(k):expanded.add(k);renderToday()}if(b.dataset.action==='toggle-cardio'){const k='c:'+c.dataset.cardio;expanded.has(k)?expanded.delete(k):expanded.add(k);renderToday()}if(b.dataset.action==='done-strength'){expanded.delete('s:'+ex.dataset.id);const l=strengthLog(ex.dataset.id);l.complete=hasStrength(l);save();renderToday()}if(b.dataset.action==='done-cardio'){expanded.delete('c:'+c.dataset.cardio);const l=cardioLog(c.dataset.cardio);l.complete=hasCardio(l);save();renderToday()}});
document.getElementById('todayContent').addEventListener('input',e=>{const ex=e.target.closest('[data-id]'),c=e.target.closest('[data-cardio]');if(ex&&e.target.dataset.set!==undefined){const l=strengthLog(ex.dataset.id);l.sets[+e.target.dataset.set][e.target.dataset.field]=e.target.value;l.complete=hasStrength(l);save();const row=e.target.closest('.set-row');row.querySelector('.set-volume').textContent=fmt(num(l.sets[+e.target.dataset.set].weight)*num(l.sets[+e.target.dataset.set].reps));ex.querySelector('.volume strong').textContent=fmt(volume(l.sets));document.querySelectorAll('.metric strong')[0].textContent=Object.values(session().strength).filter(hasStrength).length+Object.values(session().cardio).filter(hasCardio).length;document.querySelectorAll('.metric strong')[1].textContent=fmt(Object.values(session().strength).filter(hasStrength).reduce((sum,x)=>sum+volume(x.sets),0))}if(c&&e.target.dataset.field==='minutes'){const l=cardioLog(c.dataset.cardio);l.minutes=e.target.value;l.complete=hasCardio(l);save();document.querySelectorAll('.metric strong')[0].textContent=Object.values(session().strength).filter(hasStrength).length+Object.values(session().cardio).filter(hasCardio).length}});

document.getElementById('historyContent').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='refresh-cloud'){b.disabled=true;b.textContent='Refreshing…';try{const count=await loadCloudHistory();renderHistory();alert('Loaded '+count+' workout'+(count===1?'':'s')+' from Google Sheets.')}catch(err){alert('Could not refresh: '+err.message)}finally{b.disabled=false}}if(b.dataset.action==='sync-pending'){const pending=Object.entries(data.sessions).filter(([k,s])=>s.savedAt&&s.syncStatus!=='synced');if(!pending.length){alert('No pending workouts.');return}b.disabled=true;b.textContent='Syncing…';let ok=0;for(const [k] of pending){try{await syncWorkout(k);ok++}catch(err){}}renderHistory();alert('Synced '+ok+' of '+pending.length+' pending workouts.')}});
document.getElementById('setupContent').addEventListener('input',e=>{const ex=e.target.closest('[data-id]'),c=e.target.closest('[data-cardio]');if(ex){const item=data.library.strength.find(x=>x.id===ex.dataset.id);item[e.target.dataset.field]=e.target.value}if(c){const item=data.library.cardio.find(x=>x.id===c.dataset.cardio);item[e.target.dataset.field]=e.target.value}save()});
document.getElementById('setupContent').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action,ex=b.closest('[data-id]'),c=b.closest('[data-cardio]');if(action==='save-cloud'){data.cloud.endpoint=GOOGLE_APPS_SCRIPT_URL;data.cloud.accessKey=(document.getElementById('cloudKey').value||'').trim();try{localStorage.setItem(CLOUD_KEY_STORAGE,data.cloud.accessKey)}catch(e){}save();renderSetup();return}if(action==='test-cloud'){data.cloud.endpoint=GOOGLE_APPS_SCRIPT_URL;data.cloud.accessKey=(document.getElementById('cloudKey').value||'').trim();try{localStorage.setItem(CLOUD_KEY_STORAGE,data.cloud.accessKey)}catch(e){}save();const state=document.getElementById('cloudState');state.className='cloud-state warn';state.textContent='Testing connection…';try{await testCloud();state.className='cloud-state ok';state.textContent='✓ Connection successful. The Workouts tab is ready.'}catch(err){state.className='cloud-state error';state.textContent='Connection failed: '+err.message}return}if(action==='add-strength')data.library.strength.push({id:uid('exercise'),name:'New Exercise',notes:''});if(action==='add-cardio')data.library.cardio.push({id:uid('cardio'),name:'New Cardio Activity',notes:''});if(action==='delete-strength'){const item=data.library.strength.find(x=>x.id===ex.dataset.id);if(!confirm(`Remove "${item.name}" from the library? Recorded history will remain.`))return;data.library.strength=data.library.strength.filter(x=>x.id!==ex.dataset.id)}if(action==='delete-cardio'){const item=data.library.cardio.find(x=>x.id===c.dataset.cardio);if(!confirm(`Remove "${item.name}" from the library? Recorded history will remain.`))return;data.library.cardio=data.library.cardio.filter(x=>x.id!==c.dataset.cardio)}if(action==='restore-strength'){const ids=new Set(data.library.strength.map(x=>x.id));STANDARD_STRENGTH.forEach(x=>{if(!ids.has(x.id))data.library.strength.push(clone(x))})}if(action==='restore-cardio'){const ids=new Set(data.library.cardio.map(x=>x.id));STANDARD_CARDIO.forEach(x=>{if(!ids.has(x.id))data.library.cardio.push(clone(x))})}save();renderAll()});
renderAll();
</script>
</body>
