<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EPIC Workout">
  <meta name="theme-color" content="#2A1550">
  <title>EPIC Workout Tracker</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --deep:#2A1550;--main:#3B1F6B;--mid:#4A2880;--light:#5B2D9E;
      --muted:#8d72bc;--soft:#d3c4ed;--yellow:#F5E642;--green:#3AAB6A;
      --red:#d95d6f;--white:#fff;--line:rgba(255,255,255,.10)
    }
    html,body{min-height:100%;background:var(--deep);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white)}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:460px;min-height:100vh;margin:auto;background:var(--main);padding-bottom:86px}
    header{position:sticky;top:0;z-index:20;background:var(--deep);padding:18px 16px 12px;border-bottom:1px solid var(--line)}
    header h1{font-size:18px;color:var(--yellow);text-align:center}
    header p{font-size:12px;color:var(--soft);text-align:center;margin-top:3px}
    .week-strip{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;padding:14px 16px 8px}
    .arrow{height:40px;border:0;border-radius:50%;background:var(--light);color:var(--yellow);font-size:24px}
    .day-head{text-align:center}
    .day-head h2{font-size:18px}
    .day-head p{font-size:12px;color:var(--soft);margin-top:3px}
    .badge{display:inline-block;margin-top:7px;padding:4px 10px;border-radius:999px;background:var(--yellow);color:var(--deep);font-size:11px;font-weight:700}
    main{padding:10px 14px 20px}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;color:var(--yellow);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .card{background:var(--mid);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
    .card-top{display:flex;gap:8px;align-items:flex-start}
    .grow{flex:1;min-width:0}
    .name-input,.notes-input,.small-input,.day-title-input{
      width:100%;border:1px solid transparent;border-radius:9px;background:rgba(0,0,0,.16);color:var(--white);outline:none
    }
    .name-input{font-weight:700;font-size:15px;padding:8px 9px}
    .notes-input{margin-top:7px;padding:8px 9px;resize:vertical;min-height:48px;font-size:12px;color:var(--soft)}
    .day-title-input{padding:9px 10px;font-weight:700;text-align:center}
    .delete{flex:0 0 38px;height:38px;border:0;border-radius:10px;background:rgba(217,93,111,.18);color:#ffb6c0;font-size:18px}
    .sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
    .set-btn{border:1px solid var(--muted);border-radius:10px;padding:9px 4px;background:transparent;color:var(--soft);font-size:12px;font-weight:700}
    .set-btn.done{background:var(--green);border-color:var(--green);color:white}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    label{display:block;font-size:11px;color:var(--soft)}
    .small-input{margin-top:5px;padding:9px;font-size:16px}
    .cardio-grid{display:grid;grid-template-columns:1fr 100px;gap:8px}
    .cardio-complete{width:100%;margin-top:10px;padding:10px;border:1px solid var(--muted);border-radius:10px;background:transparent;color:var(--soft);font-weight:700}
    .cardio-complete.done{background:var(--green);border-color:var(--green);color:white}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
    .primary,.secondary,.danger-lite{border:0;border-radius:12px;padding:11px;font-weight:700}
    .primary{background:var(--yellow);color:var(--deep)}
    .secondary{background:var(--light);color:white}
    .danger-lite{width:100%;margin-top:8px;background:transparent;border:1px solid rgba(217,93,111,.55);color:#ffb6c0}
    .notes-card textarea{width:100%;margin-top:8px;border:0;border-radius:10px;background:rgba(0,0,0,.16);color:white;padding:10px;min-height:78px;resize:vertical}
    .empty{padding:20px;text-align:center;color:var(--soft);font-size:13px;border:1px dashed var(--muted);border-radius:14px}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;display:flex;background:var(--deep);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
    .nav{flex:1;border:0;background:transparent;color:var(--muted);padding:5px;font-size:12px}
    .nav span{display:block;font-size:21px;margin-bottom:2px}
    .nav.active{color:var(--yellow)}
    .history-controls{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
    .pill{flex:none;border:1px solid var(--light);border-radius:999px;padding:7px 12px;background:transparent;color:var(--soft)}
    .pill.active{background:var(--yellow);border-color:var(--yellow);color:var(--deep)}
    .history-week{margin:14px 0 8px;color:var(--yellow);font-size:13px}
    .history-row{background:var(--mid);border-radius:12px;padding:10px 12px;margin-bottom:7px}
    .history-row strong{display:block;font-size:13px}
    .history-row small{display:block;color:var(--soft);margin-top:3px}
    .notice{font-size:12px;color:var(--soft);background:rgba(245,230,66,.08);border:1px solid rgba(245,230,66,.2);padding:10px;border-radius:12px;margin-bottom:10px}
    .hidden{display:none!important}
    @media(max-width:350px){.cardio-grid,.metrics{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>EPIC Workout Tracker</h1>
    <p id="todayLabel"></p>
  </header>

  <section id="workoutView">
    <div class="week-strip">
      <button class="arrow" id="prevDay" aria-label="Previous day">‹</button>
      <div class="day-head">
        <h2 id="dayName"></h2>
        <p id="dayDate"></p>
        <span class="badge" id="dayBadge"></span>
      </div>
      <button class="arrow" id="nextDay" aria-label="Next day">›</button>
    </div>
    <main id="workoutContent"></main>
  </section>

  <section id="historyView" class="hidden">
    <main>
      <div class="notice">History is stored on this device. Existing data from the prior app is left untouched and legacy weight entries are shown when available.</div>
      <div class="history-controls" id="historyDays"></div>
      <div id="historyContent"></div>
    </main>
  </section>

  <nav class="bottom">
    <button class="nav active" id="workoutNav"><span>🏋️</span>Workout</button>
    <button class="nav" id="historyNav"><span>📈</span>History</button>
  </nav>
</div>

<script>
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STORAGE='epic_workout_v6';

const standardExercises=[
  {id:'incline-db',name:'Incline DB Press',notes:'45-degree incline dumbbell bench press',sets:3,reps:10},
  {id:'incline-machine',name:'Incline Chest Press',notes:'Incline chest press machine',sets:3,reps:10},
  {id:'lateral-raise',name:'Lateral Raise',notes:'Two-arm lateral shoulder raise using curl bar',sets:3,reps:10},
  {id:'seated-db-curl',name:'Seated DB Curl',notes:'Seated dumbbell curls',sets:3,reps:10},
  {id:'trap-deadlift',name:'Trap Bar Deadlift',notes:'Trap bar deadlift',sets:3,reps:8},
  {id:'leg-press',name:'Leg Press',notes:'Leg press machine',sets:3,reps:10},
  {id:'face-pull',name:'Face Pull',notes:'Seated face pull with rope grip',sets:3,reps:12},
  {id:'tricep-pulldown',name:'Tricep Pulldown',notes:'Straight-bar tricep cable pulldown',sets:3,reps:10},
  {id:'calf-raise',name:'Calf Raise',notes:'Calf machine',sets:3,reps:12}
];

const defaults={
  Monday:{title:'Standard Gym Workout',type:'Gym · Hard',strength:clone(standardExercises),cardio:[]},
  Tuesday:{title:'Running Club',type:'Cardio',strength:[],cardio:[{id:'run-5k',name:'Outdoor Run / 5K',minutes:'',notes:'Running club or hard cardio session'}]},
  Wednesday:{title:'Easy / Open Day',type:'Flexible',strength:[],cardio:[]},
  Thursday:{title:'Standard Gym Workout',type:'Gym · Hard',strength:clone(standardExercises),cardio:[{id:'incline-walk',name:'Incline Treadmill',minutes:'30',notes:'Adjust speed and incline as needed'}]},
  Friday:{title:'Easy / Open Day',type:'Flexible',strength:[],cardio:[]},
  Saturday:{title:'Moderate Gym Day',type:'Gym · Moderate',strength:[
    {id:'left-curl',name:'Left DB Curl',notes:'Single-arm dumbbell curl — left side',sets:3,reps:10},
    {id:'left-row',name:'Left Cable Row',notes:'Single-arm cable row — left side',sets:3,reps:10},
    {id:'left-press',name:'Left Overhead Press',notes:'Single-arm overhead press — left side',sets:3,reps:10},
    {id:'left-tricep',name:'Left Tricep Extension',notes:'Single-arm tricep extension — left side',sets:3,reps:10}
  ],cardio:[{id:'light-cardio',name:'Light Cardio',minutes:'20',notes:'Treadmill, bike, elliptical, rower, or other'}]},
  Sunday:{title:'Rest & Recovery',type:'Rest',strength:[],cardio:[]}
};

let data=load();
let dayIndex=new Date().getDay();
let historyDay='Monday';

function clone(v){return JSON.parse(JSON.stringify(v));}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');
    if(saved && saved.plans && saved.logs) return saved;
  }catch(e){}
  const initial={plans:clone(defaults),logs:{},dayNotes:{}};
  localStorage.setItem(STORAGE,JSON.stringify(initial));
  return initial;
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(data));}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function weekKey(date=new Date()){
  const d=new Date(date); d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return d.getFullYear()+'-W'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}
function weekLabel(key){
  const [y,md]=key.split('-W'); const d=new Date(+y,+md.slice(0,2)-1,+md.slice(2,4));
  return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function currentLog(day){
  const wk=weekKey();
  data.logs[wk]??={}; data.logs[wk][day]??={strength:{},cardio:{}};
  return data.logs[wk][day];
}
function dateForDay(idx){
  const d=new Date(); d.setDate(d.getDate()+(idx-d.getDay())); return d;
}
function updateHeader(){
  const day=DAYS[dayIndex], plan=data.plans[day], d=dateForDay(dayIndex);
  document.getElementById('dayName').textContent=day;
  document.getElementById('dayDate').textContent=d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  document.getElementById('dayBadge').textContent=plan.type;
  document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
function render(){
  updateHeader();
  const day=DAYS[dayIndex], plan=data.plans[day], log=currentLog(day);
  let html=`<div class="card">
    <label>Workout title
      <input class="day-title-input" data-action="day-title" value="${esc(plan.title)}">
    </label>
  </div>`;

  html+=`<div class="section-title"><span>Strength exercises</span><span>${plan.strength.length}</span></div>`;
  if(!plan.strength.length) html+=`<div class="empty">No strength exercises planned for this day.</div>`;
  plan.strength.forEach(ex=>{
    const exlog=log.strength[ex.id]||{};
    html+=`<article class="card" data-exercise="${esc(ex.id)}">
      <div class="card-top">
        <div class="grow">
          <input class="name-input" data-action="strength-name" value="${esc(ex.name)}" aria-label="Exercise name">
          <textarea class="notes-input" data-action="strength-notes" aria-label="Exercise notes" placeholder="Equipment, form cues, seat position...">${esc(ex.notes)}</textarea>
        </div>
        <button class="delete" data-action="delete-strength" aria-label="Delete ${esc(ex.name)}">🗑</button>
      </div>
      <div class="sets">
        ${[0,1,2].map(i=>`<button class="set-btn ${exlog.sets?.[i]?'done':''}" data-action="toggle-set" data-set="${i}">${exlog.sets?.[i]?'✓ Set '+(i+1):'Set '+(i+1)}</button>`).join('')}
      </div>
      <div class="metrics">
        <label>Weight (lb)<input class="small-input" type="number" inputmode="decimal" data-action="weight" value="${esc(exlog.weight||'')}" placeholder="0"></label>
        <label>Reps<input class="small-input" type="number" inputmode="numeric" data-action="reps" value="${esc(exlog.reps??ex.reps??10)}" placeholder="10"></label>
      </div>
    </article>`;
  });

  html+=`<div class="section-title"><span>Cardio</span><span>${plan.cardio.length}</span></div>`;
  if(!plan.cardio.length) html+=`<div class="empty">No cardio planned. Add an entry when needed.</div>`;
  plan.cardio.forEach(item=>{
    const clog=log.cardio[item.id]||{};
    html+=`<article class="card" data-cardio="${esc(item.id)}">
      <div class="card-top">
        <div class="grow">
          <div class="cardio-grid">
            <label>Exercise<input class="name-input" data-action="cardio-name" value="${esc(item.name)}" placeholder="Bike, treadmill, run..."></label>
            <label>Minutes<input class="small-input" type="number" inputmode="numeric" data-action="cardio-minutes" value="${esc(clog.minutes??item.minutes??'')}" placeholder="30"></label>
          </div>
          <textarea class="notes-input" data-action="cardio-notes" placeholder="Optional cardio notes">${esc(item.notes||'')}</textarea>
        </div>
        <button class="delete" data-action="delete-cardio" aria-label="Delete cardio">🗑</button>
      </div>
      <button class="cardio-complete ${clog.done?'done':''}" data-action="toggle-cardio">${clog.done?'✓ Complete':'Mark Complete'}</button>
    </article>`;
  });

  html+=`<div class="actions">
    <button class="primary" data-action="add-strength">+ Add Exercise</button>
    <button class="secondary" data-action="add-cardio">+ Add Cardio</button>
  </div>
  <button class="danger-lite" data-action="reset-day">Restore ${day} defaults</button>
  <div class="section-title"><span>Day notes</span></div>
  <div class="card notes-card"><textarea data-action="day-notes" placeholder="Energy, soreness, changes, or anything to remember...">${esc(data.dayNotes[weekKey()]?.[day]||'')}</textarea></div>`;

  const root=document.getElementById('workoutContent');
  root.innerHTML=html;
  bindWorkoutEvents(root,day,plan,log);
}
function bindWorkoutEvents(root,day,plan,log){
  root.addEventListener('input',e=>{
    const el=e.target, action=el.dataset.action;
    if(action==='day-title') plan.title=el.value;
    if(action==='day-notes'){data.dayNotes[weekKey()]??={};data.dayNotes[weekKey()][day]=el.value;}
    const exCard=el.closest('[data-exercise]');
    if(exCard){
      const ex=plan.strength.find(x=>x.id===exCard.dataset.exercise);
      const exlog=log.strength[ex.id]??={};
      if(action==='strength-name') ex.name=el.value;
      if(action==='strength-notes') ex.notes=el.value;
      if(action==='weight') exlog.weight=el.value;
      if(action==='reps') exlog.reps=el.value;
      exlog.nameSnapshot=ex.name; exlog.notesSnapshot=ex.notes;
    }
    const card=el.closest('[data-cardio]');
    if(card){
      const item=plan.cardio.find(x=>x.id===card.dataset.cardio);
      const clog=log.cardio[item.id]??={};
      if(action==='cardio-name') item.name=el.value;
      if(action==='cardio-notes') item.notes=el.value;
      if(action==='cardio-minutes') clog.minutes=el.value;
      clog.nameSnapshot=item.name;
    }
    save();
  });
  root.addEventListener('click',e=>{
    const btn=e.target.closest('button'); if(!btn)return;
    const action=btn.dataset.action;
    const exCard=btn.closest('[data-exercise]');
    const cardioCard=btn.closest('[data-cardio]');
    if(action==='toggle-set'){
      const id=exCard.dataset.exercise, exlog=log.strength[id]??={};
      exlog.sets??=[false,false,false];
      const i=+btn.dataset.set; exlog.sets[i]=!exlog.sets[i];
      const ex=plan.strength.find(x=>x.id===id); exlog.nameSnapshot=ex.name; exlog.notesSnapshot=ex.notes;
      save();render();
    }
    if(action==='delete-strength'){
      const id=exCard.dataset.exercise, ex=plan.strength.find(x=>x.id===id);
      if(confirm(`Remove "${ex.name}" from ${day}? Historical workout data will remain.`)){
        plan.strength=plan.strength.filter(x=>x.id!==id);save();render();
      }
    }
    if(action==='toggle-cardio'){
      const id=cardioCard.dataset.cardio, clog=log.cardio[id]??={};
      clog.done=!clog.done; const item=plan.cardio.find(x=>x.id===id);clog.nameSnapshot=item.name;
      save();render();
    }
    if(action==='delete-cardio'){
      const id=cardioCard.dataset.cardio, item=plan.cardio.find(x=>x.id===id);
      if(confirm(`Remove "${item.name}" from ${day}? Historical workout data will remain.`)){
        plan.cardio=plan.cardio.filter(x=>x.id!==id);save();render();
      }
    }
    if(action==='add-strength'){
      plan.strength.push({id:uid('exercise'),name:'New Exercise',notes:'Tap to add equipment or form notes',sets:3,reps:10});save();render();
    }
    if(action==='add-cardio'){
      plan.cardio.push({id:uid('cardio'),name:'Cardio Exercise',minutes:'',notes:''});save();render();
    }
    if(action==='reset-day' && confirm(`Restore the original ${day} plan? This changes the plan only; logged history remains.`)){
      data.plans[day]=clone(defaults[day]);save();render();
    }
  });
}
function renderHistory(){
  const days=DAYS.filter(d=>data.plans[d].strength.length||data.plans[d].cardio.length);
  if(!days.includes(historyDay)) historyDay=days[0]||'Monday';
  document.getElementById('historyDays').innerHTML=days.map(d=>`<button class="pill ${d===historyDay?'active':''}" data-day="${d}">${d}</button>`).join('');
  document.querySelectorAll('#historyDays .pill').forEach(b=>b.addEventListener('click',()=>{historyDay=b.dataset.day;renderHistory()}));

  const weeks=Object.keys(data.logs).sort().reverse();
  let html='';
  weeks.forEach(wk=>{
    const daylog=data.logs[wk]?.[historyDay]; if(!daylog)return;
    const rows=[];
    Object.entries(daylog.strength||{}).forEach(([id,l])=>{
      if(!l.weight && !(l.sets||[]).some(Boolean))return;
      const current=data.plans[historyDay].strength.find(x=>x.id===id);
      rows.push(`<div class="history-row"><strong>${esc(l.nameSnapshot||current?.name||'Exercise')}</strong><small>${esc(l.weight||'—')} lb · ${esc(l.reps||current?.reps||'—')} reps · ${(l.sets||[]).filter(Boolean).length}/3 sets</small></div>`);
    });
    Object.entries(daylog.cardio||{}).forEach(([id,l])=>{
      if(!l.minutes&&!l.done)return;
      const current=data.plans[historyDay].cardio.find(x=>x.id===id);
      rows.push(`<div class="history-row"><strong>${esc(l.nameSnapshot||current?.name||'Cardio')}</strong><small>${esc(l.minutes||'—')} minutes${l.done?' · completed':''}</small></div>`);
    });
    if(rows.length) html+=`<div class="history-week">Week of ${weekLabel(wk)}</div>${rows.join('')}`;
  });

  html+=legacyHistory(historyDay);
  document.getElementById('historyContent').innerHTML=html||'<div class="empty">No workout history for this day yet.</div>';
}
function legacyHistory(day){
  let old={};try{old=JSON.parse(localStorage.getItem('wt_v5')||'{}')}catch(e){return''}
  const oldNames={
    Monday:['Dumbbell Incline Bench Press','Neutral Grip Lat Pulldown','Cable Single Arm Shoulder Press','Standing Cable Rear Delt Fly','Cable Single Arm Bicep Curl','Smith Machine Close Grip Bench Press'],
    Thursday:['Smith Machine Reverse Lunge','Bent Knee Inverted Rows','Leg Press Single Leg Calf Raise','Dumbbell Single Arm Preacher Curl','Single Arm Tricep Pushdown'],
    Saturday:['Single-Arm DB Curl (left)','Single-Arm Cable Row (left)','Single-Arm Overhead Press (left)','Single-Arm Tricep Extension (left)']
  };
  if(!oldNames[day])return'';
  const groups={};
  Object.keys(old).forEach(k=>{
    const m=k.match(/^w_(\d{4}-W\d{4})_([^_]+)_(\d+)$/);
    if(!m||m[2]!==day||!old[k])return;
    groups[m[1]]??=[];groups[m[1]].push({name:oldNames[day][+m[3]]||'Legacy exercise',weight:old[k]});
  });
  return Object.keys(groups).sort().reverse().map(wk=>`<div class="history-week">Legacy · Week of ${weekLabel(wk)}</div>${groups[wk].map(r=>`<div class="history-row"><strong>${esc(r.name)}</strong><small>${esc(r.weight)} lb · prior app</small></div>`).join('')}`).join('');
}

document.getElementById('prevDay').addEventListener('click',()=>{dayIndex=(dayIndex+6)%7;render()});
document.getElementById('nextDay').addEventListener('click',()=>{dayIndex=(dayIndex+1)%7;render()});
document.getElementById('workoutNav').addEventListener('click',()=>{
  document.getElementById('workoutView').classList.remove('hidden');
  document.getElementById('historyView').classList.add('hidden');
  document.getElementById('workoutNav').classList.add('active');
  document.getElementById('historyNav').classList.remove('active');
});
document.getElementById('historyNav').addEventListener('click',()=>{
  document.getElementById('workoutView').classList.add('hidden');
  document.getElementById('historyView').classList.remove('hidden');
  document.getElementById('workoutNav').classList.remove('active');
  document.getElementById('historyNav').classList.add('active');
  renderHistory();
});
render();
</script>
</body>
</html>
